name: Build and Push to GHCR
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: octoeverywhere-release
  cancel-in-progress: false
  queue: max

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
      upstream-digest: ${{ steps.check.outputs.upstream-digest }}
      upstream-tag: ${{ steps.check.outputs.upstream-tag }}
      upstream-config: ${{ steps.check.outputs.upstream-config }}
      upstream-config-hash: ${{ steps.check.outputs.upstream-config-hash }}
      significant-change: ${{ steps.check.outputs.significant-change }}
    steps:
      - name: Check upstream image updates
        id: check
        run: |
          # Pull the upstream image to inspect it
          docker pull octoeverywhere/octoeverywhere:latest

          UPSTREAM_IMAGE=$(docker image inspect octoeverywhere/octoeverywhere:latest --format='{{index .RepoDigests 0}}')

          UPSTREAM_DIGEST=${UPSTREAM_IMAGE##*@}
          echo "upstream-digest=$UPSTREAM_DIGEST" >> "$GITHUB_OUTPUT"

          # The action's list parser can alter JSON quotes. Pass the command as a file.
          UPSTREAM_CONFIG=$(docker image inspect "$UPSTREAM_IMAGE" --format '{{json .Config}}' \
            | jq -c '{entrypoint: .Entrypoint, cmd: .Cmd}')
          CONFIG_HASH=$(printf '%s' "$UPSTREAM_CONFIG" | sha256sum | cut -d' ' -f1)
          echo "upstream-config=$UPSTREAM_CONFIG" >> "$GITHUB_OUTPUT"
          echo "upstream-config-hash=$CONFIG_HASH" >> "$GITHUB_OUTPUT"

          if ! INDEX=$(docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/octoeverywhere:latest --raw); then
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then
              echo "::error::Cannot read release state from GHCR; refusing scheduled publish."
              exit 1
            fi
            INDEX='{}'
          fi
          EXISTING_DIGEST=$(jq -r '.annotations."upstream.digest" // empty' <<< "$INDEX")
          BLOCKED_DIGEST=$(jq -r '.annotations."rollback.blocked-upstream" // empty' <<< "$INDEX")
          if [ "$GITHUB_EVENT_NAME" = schedule ] &&
            { [ "$BLOCKED_DIGEST" = "$UPSTREAM_DIGEST" ] || [ "$BLOCKED_DIGEST" = manual ] || [ "$EXISTING_DIGEST" = "$UPSTREAM_DIGEST" ]; }; then
            echo "should-build=false" >> "$GITHUB_OUTPUT"
            echo "Upstream digest is already published or held by a rollback."
            exit 0
          fi

          EXISTING_CONFIG_HASH=$(jq -r '.annotations."upstream.config-hash" // empty' <<< "$INDEX")
          if [ -z "$EXISTING_CONFIG_HASH" ]; then
            # Some older releases contain malformed JSON in these annotations.
            if LEGACY_CONFIG=$(jq -ce '
              .annotations | {entrypoint: (."upstream.entrypoint" | fromjson), cmd: (."upstream.cmd" | fromjson)}
            ' <<< "$INDEX" 2>/dev/null); then
              EXISTING_CONFIG_HASH=$(printf '%s' "$LEGACY_CONFIG" | sha256sum | cut -d' ' -f1)
            fi
          fi
          SIGNIFICANT_CHANGE=false
          if [ -z "$EXISTING_CONFIG_HASH" ]; then
            echo "::notice::No comparable upstream configuration on the previous release."
          elif [ "$EXISTING_CONFIG_HASH" != "$CONFIG_HASH" ]; then
            SIGNIFICANT_CHANGE=true
            echo "::warning::Upstream entrypoint or command changed."
          fi
          echo "significant-change=$SIGNIFICANT_CHANGE" >> "$GITHUB_OUTPUT"

          # Resolve the upstream version (e.g. "5.1.1") using several methods,
          # most-authoritative-but-fragile first, each only accepted if it looks
          # like a semver. This way a single upstream change (dropping a label,
          # moving a file) degrades to the next method instead of breaking the build.
          is_semver() { [[ "$1" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; }
          UPSTREAM_TAG=""

          # Method 1 (legacy): the org.opencontainers.image.version label, if set.
          CANDIDATE=$(docker image inspect "$UPSTREAM_IMAGE" --format='{{index .Config.Labels "org.opencontainers.image.version"}}' 2>/dev/null || true)
          if is_semver "$CANDIDATE"; then UPSTREAM_TAG="$CANDIDATE"; echo "Version from image label: $UPSTREAM_TAG"; fi

          # Method 2: pyproject.toml baked into the image (REPO_DIR=/app/octoeverywhere).
          # Upstream COPYs the whole repo in, so this tracks exactly what :latest contains.
          if [ -z "$UPSTREAM_TAG" ]; then
            CANDIDATE=$(docker run --rm --entrypoint cat "$UPSTREAM_IMAGE" /app/octoeverywhere/pyproject.toml 2>/dev/null \
              | grep -m1 -E '^version[[:space:]]*=' | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/' || true)
            if is_semver "$CANDIDATE"; then UPSTREAM_TAG="$CANDIDATE"; echo "Version from pyproject.toml: $UPSTREAM_TAG"; fi
          fi

          if [ -z "$UPSTREAM_TAG" ]; then
            echo "::error::Could not resolve an upstream semver; refusing to publish."
            exit 1
          fi

          echo "Resolved upstream version: $UPSTREAM_TAG"
          echo "upstream-tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

          echo "should-build=true" >> "$GITHUB_OUTPUT"

  # Single job on a single runner: nothing is pushed to the registry until the
  # tests pass, so we never publish a usable-looking tag for a broken build.
  build-test-publish:
    needs: check-upstream
    if: needs.check-upstream.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write upstream configuration
        env:
          UPSTREAM_CONFIG: ${{ needs.check-upstream.outputs.upstream-config }}
        run: printf '%s\n' "$UPSTREAM_CONFIG" | jq -ce 'select(type == "object")' > upstream_config.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build amd64 locally and load it — NOT pushed. This is the artifact we test.
      - name: Build test image (amd64, local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: octoeverywhere:test
          build-args: |
            UPSTREAM_IMAGE=octoeverywhere/octoeverywhere@${{ needs.check-upstream.outputs.upstream-digest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run comprehensive tests
        run: |
          ./test-wrapper.sh octoeverywhere:test

      # Publish cascading version tags only after the pinned image passes tests.
      - name: Compute release tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/octoeverywhere
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.check-upstream.outputs.upstream-tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check-upstream.outputs.upstream-tag }}
            type=semver,pattern={{major}},value=${{ needs.check-upstream.outputs.upstream-tag }}

      # Tests passed: build multi-arch and push straight to the release tags.
      # No candidate/intermediate tags are ever created.
      - name: Build and push release tags (multi-arch)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          # build-push-action v6+ enables provenance/SBOM attestations by default,
          # which add an extra "unknown/unknown" entry to the image index. Disable
          # to keep the published index to exactly the two real platforms.
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            UPSTREAM_IMAGE=octoeverywhere/octoeverywhere@${{ needs.check-upstream.outputs.upstream-digest }}
          annotations: |
            index:upstream.digest=${{ needs.check-upstream.outputs.upstream-digest }}
            index:upstream.config-hash=${{ needs.check-upstream.outputs.upstream-config-hash }}
            index:upstream.tag=${{ needs.check-upstream.outputs.upstream-tag }}
            index:build.run=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-significant-change:
    needs: [check-upstream, build-test-publish]
    if: needs.check-upstream.outputs.significant-change == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notify significant upstream change via Telegram
        run: |
          MESSAGE="⚠️ <b>OctoEverywhere: significant upstream change deployed</b>%0A%0AThe upstream image entrypoint or command changed. Please verify the wrapper still works correctly.%0A%0A<b>Repo:</b> ${{ github.repository }}%0A<b>Run:</b> ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="${MESSAGE}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
  notify-failure:
    needs: [check-upstream, build-test-publish]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify build failure via Telegram
        run: |
          echo "::error title=Build Failed::Wrapper image build or test failed. Check logs and upstream compatibility."
          MESSAGE="❌ <b>OctoEverywhere wrapper build failed</b>%0A%0A<b>Repo:</b> ${{ github.repository }}%0A<b>Run:</b> ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0A<b>Trigger:</b> ${{ github.event_name }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="${MESSAGE}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
