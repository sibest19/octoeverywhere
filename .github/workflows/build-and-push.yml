name: Build and Push to GHCR
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
      upstream-digest: ${{ steps.check.outputs.upstream-digest }}
      upstream-tag: ${{ steps.check.outputs.upstream-tag }}
      upstream-entrypoint: ${{ steps.check.outputs.upstream-entrypoint }}
      upstream-cmd: ${{ steps.check.outputs.upstream-cmd }}
      significant-change: ${{ steps.check.outputs.significant-change }}
    steps:
      - name: Check upstream image updates
        id: check
        run: |
          # Pull the upstream image to inspect it
          docker pull octoeverywhere/octoeverywhere:latest

          # Get current upstream image digest
          UPSTREAM_DIGEST=$(docker image inspect octoeverywhere/octoeverywhere:latest --format='{{index .RepoDigests 0}}' | cut -d'@' -f2)
          echo "upstream-digest=$UPSTREAM_DIGEST" >> $GITHUB_OUTPUT

          # Extract upstream entrypoint and cmd
          UPSTREAM_ENTRYPOINT=$(docker image inspect octoeverywhere/octoeverywhere:latest --format='{{json .Config.Entrypoint}}')
          UPSTREAM_CMD=$(docker image inspect octoeverywhere/octoeverywhere:latest --format='{{json .Config.Cmd}}')
          echo "upstream-entrypoint=$UPSTREAM_ENTRYPOINT" >> $GITHUB_OUTPUT
          echo "upstream-cmd=$UPSTREAM_CMD" >> $GITHUB_OUTPUT

          # Resolve the upstream version (e.g. "5.1.1") using several methods,
          # most-authoritative-but-fragile first, each only accepted if it looks
          # like a semver. This way a single upstream change (dropping a label,
          # moving a file) degrades to the next method instead of breaking the build.
          is_semver() { echo "$1" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; }
          UPSTREAM_TAG=""

          # Method 1 (legacy): the org.opencontainers.image.version label, if set.
          CANDIDATE=$(docker image inspect octoeverywhere/octoeverywhere:latest --format='{{index .Config.Labels "org.opencontainers.image.version"}}' 2>/dev/null || true)
          if is_semver "$CANDIDATE"; then UPSTREAM_TAG="$CANDIDATE"; echo "Version from image label: $UPSTREAM_TAG"; fi

          # Method 2: pyproject.toml baked into the image (REPO_DIR=/app/octoeverywhere).
          # Upstream COPYs the whole repo in, so this tracks exactly what :latest contains.
          if [ -z "$UPSTREAM_TAG" ]; then
            CANDIDATE=$(docker run --rm --entrypoint cat octoeverywhere/octoeverywhere:latest /app/octoeverywhere/pyproject.toml 2>/dev/null \
              | grep -E '^version[[:space:]]*=' | head -1 | sed -E 's/.*=[[:space:]]*"([^"]+)".*/\1/')
            if is_semver "$CANDIDATE"; then UPSTREAM_TAG="$CANDIDATE"; echo "Version from pyproject.toml: $UPSTREAM_TAG"; fi
          fi

          # No semver found by any method: leave it as "latest" so the downstream
          # metadata step produces an empty tag list and the build fails loudly
          # (and notifies via Telegram). We intentionally never publish an
          # unversioned image — every release must carry a real semver.
          if [ -z "$UPSTREAM_TAG" ]; then UPSTREAM_TAG="latest"; echo "::warning::Could not resolve a semver version upstream; the build will fail rather than publish an unversioned image."; fi

          echo "Resolved upstream version: $UPSTREAM_TAG"
          echo "upstream-tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT

          # Read back what we last published, from the index annotations on our :latest
          EXISTING_DIGEST=$(docker manifest inspect ghcr.io/${{ github.repository_owner }}/octoeverywhere:latest 2>/dev/null | jq -r '.annotations."upstream.digest" // empty' || echo "")
          EXISTING_ENTRYPOINT=$(docker manifest inspect ghcr.io/${{ github.repository_owner }}/octoeverywhere:latest 2>/dev/null | jq -r '.annotations."upstream.entrypoint" // empty' || echo "")
          EXISTING_CMD=$(docker manifest inspect ghcr.io/${{ github.repository_owner }}/octoeverywhere:latest 2>/dev/null | jq -r '.annotations."upstream.cmd" // empty' || echo "")

          # Check for significant changes that might break our wrapper
          SIGNIFICANT_CHANGE="false"
          if [ -n "$EXISTING_ENTRYPOINT" ] && { [ "$UPSTREAM_ENTRYPOINT" != "$EXISTING_ENTRYPOINT" ] || [ "$UPSTREAM_CMD" != "$EXISTING_CMD" ]; }; then
            echo "⚠️ SIGNIFICANT CHANGE DETECTED ⚠️"
            echo "Entrypoint changed: $EXISTING_ENTRYPOINT -> $UPSTREAM_ENTRYPOINT"
            echo "Command changed: $EXISTING_CMD -> $UPSTREAM_CMD"
            SIGNIFICANT_CHANGE="true"
          fi
          echo "significant-change=$SIGNIFICANT_CHANGE" >> $GITHUB_OUTPUT

          if [ "$UPSTREAM_DIGEST" != "$EXISTING_DIGEST" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "Upstream image has been updated or manual trigger detected"
            echo "Upstream entrypoint: $UPSTREAM_ENTRYPOINT"
            echo "Upstream cmd: $UPSTREAM_CMD"
          else
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "No upstream changes detected"
          fi

  # Single job on a single runner: nothing is pushed to the registry until the
  # tests pass, so we never publish a usable-looking tag for a broken build.
  build-test-publish:
    needs: check-upstream
    if: needs.check-upstream.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build amd64 locally and load it — NOT pushed. This is the artifact we test.
      - name: Build test image (amd64, local)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: octoeverywhere:test
          build-args: |
            UPSTREAM_ENTRYPOINT=${{ needs.check-upstream.outputs.upstream-entrypoint }}
            UPSTREAM_CMD=${{ needs.check-upstream.outputs.upstream-cmd }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run comprehensive tests
        run: |
          ./test-wrapper.sh octoeverywhere:test

      # Generate the cascading semver tags from the upstream version (resolved in
      # check-upstream). 5.1.1 -> :5.1.1, :5.1, :5. flavor: latest=true promotes
      # the resolved semver to also carry :latest, so every publish is consistently
      # semver-driven. If the version is ever not a valid semver (all resolution
      # methods failed), the semver tags are skipped, the tag list is empty, and
      # the push fails — intentional: we only ever publish semver-versioned images
      # rather than an unversioned :latest. The failure is surfaced via Telegram.
      - name: Compute release tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/octoeverywhere
          flavor: |
            latest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.check-upstream.outputs.upstream-tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check-upstream.outputs.upstream-tag }}
            type=semver,pattern={{major}},value=${{ needs.check-upstream.outputs.upstream-tag }}

      # Tests passed: build multi-arch and push straight to the release tags.
      # No candidate/intermediate tags are ever created.
      - name: Build and push release tags (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # build-push-action v6+ enables provenance/SBOM attestations by default,
          # which add an extra "unknown/unknown" entry to the image index. Disable
          # to keep the published index to exactly the two real platforms.
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            UPSTREAM_ENTRYPOINT=${{ needs.check-upstream.outputs.upstream-entrypoint }}
            UPSTREAM_CMD=${{ needs.check-upstream.outputs.upstream-cmd }}
          # Annotations are written on the image index so check-upstream can read
          # them back via `docker manifest inspect` on the next run.
          annotations: |
            index:upstream.digest=${{ needs.check-upstream.outputs.upstream-digest }}
            index:upstream.tag=${{ needs.check-upstream.outputs.upstream-tag }}
            index:upstream.entrypoint=${{ needs.check-upstream.outputs.upstream-entrypoint }}
            index:upstream.cmd=${{ needs.check-upstream.outputs.upstream-cmd }}
            index:build.run=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-significant-change:
    needs: [check-upstream, build-test-publish]
    if: needs.check-upstream.outputs.significant-change == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notify significant upstream change via Telegram
        run: |
          MESSAGE="⚠️ <b>OctoEverywhere: significant upstream change deployed</b>%0A%0AThe upstream image entrypoint or command changed. Please verify the wrapper still works correctly.%0A%0A<b>Repo:</b> ${{ github.repository }}%0A<b>Run:</b> ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="${MESSAGE}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
  notify-failure:
    needs: [check-upstream, build-test-publish]
    if: failure() && needs.check-upstream.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notify build failure via Telegram
        run: |
          echo "::error title=Build Failed::Wrapper image build or test failed. Check logs and upstream compatibility."
          MESSAGE="❌ <b>OctoEverywhere wrapper build failed</b>%0A%0A<b>Repo:</b> ${{ github.repository }}%0A<b>Run:</b> ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0A<b>Trigger:</b> ${{ github.event_name }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="${MESSAGE}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
