name: Emergency Rollback
on:
  workflow_dispatch:
    inputs:
      rollback_to:
        description: 'Tag to rollback to (e.g., 5.0.1)'
        required: true
      reason:
        description: 'Reason for rollback'
        required: true
concurrency:
  group: octoeverywhere-release
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/octoeverywhere
      ROLLBACK_TO: ${{ inputs.rollback_to }}
      ROLLBACK_REASON: ${{ inputs.reason }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify rollback target
        id: target
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$ROLLBACK_TO" --format '{{.Manifest.Digest}}')
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw | jq -e '
            [.manifests[].platform | .os + "/" + .architecture] |
            index("linux/amd64") != null and index("linux/arm64") != null'
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Backup current latest before rollback
        id: backup
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}')
          BLOCKED_DIGEST=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw | jq -er '
            .annotations | ."rollback.blocked-upstream" // ."upstream.digest" // "manual"')
          docker buildx imagetools create --tag "$IMAGE:pre-rollback-backup" "$IMAGE@$DIGEST"
          echo "blocked-digest=$BLOCKED_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Perform rollback
        env:
          TARGET_DIGEST: ${{ steps.target.outputs.digest }}
          BLOCKED_DIGEST: ${{ steps.backup.outputs.blocked-digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" \
            --annotation "index:rollback.blocked-upstream=$BLOCKED_DIGEST" "$IMAGE@$TARGET_DIGEST"
          echo "::notice title=Rollback Complete::Successfully rolled back to $ROLLBACK_TO"
          echo "Reason: $ROLLBACK_REASON"
      - name: Create rollback issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Emergency Rollback Performed - ${new Date().toISOString().split('T')[0]}`,
              body: [
                '## Emergency Rollback',
                `Target: ${process.env.ROLLBACK_TO}`,
                `Reason: ${process.env.ROLLBACK_REASON}`,
                `Performed by: @${context.actor}`,
                '',
                'Previous latest saved as pre-rollback-backup.',
                'Both AMD64 and ARM64 were preserved.',
                '',
                '- [ ] Investigate the failure and test a fix.',
                '- [ ] Close this issue after recovery.'
              ].join('\n'),
              labels: ['rollback', 'urgent']
            });
