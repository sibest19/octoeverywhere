name: Health Check
on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to health check (default: latest)'
        required: false
        default: 'latest'
permissions:
  contents: read
  issues: write
jobs:
  health-check:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/octoeverywhere
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate image tag
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker image tag."
            exit 1
          fi
      - name: Run health check
        id: check
        run: ./health-check.sh "$IMAGE_REPO:$IMAGE_TAG"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
      - name: Create issue on health check failure
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const issues = await github.rest.issues.listForRepo({
              ...repo,
              state: 'open',
              labels: 'health-check,automated'
            });
            if (issues.data.length === 0) {
              const runUrl = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.create({
                ...repo,
                title: `Health Check Failed - ${new Date().toISOString().split('T')[0]}`,
                body: [
                  `Image: ${process.env.IMAGE_REPO}:${process.env.IMAGE_TAG}`,
                  `[View workflow logs](${runUrl})`,
                  '',
                  'Check image availability, wrapper startup and logs. Close this issue after recovery.'
                ].join('\n'),
                labels: ['health-check', 'automated', 'urgent']
              });
            }
